# Sized for an 8 GB Mac running an emulator or simulator alongside the build.
org.gradle.jvmargs=-Xmx3g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true

kotlin.code.style=official
# Compile Kotlin inside the Gradle daemon: one JVM instead of two.
kotlin.compiler.execution.strategy=in-process
# iOS targets are skipped on Linux CI runners; the macOS job builds them.
kotlin.native.ignoreDisabledTargets=true

android.useAndroidX=true
android.nonTransitiveRClass=true
